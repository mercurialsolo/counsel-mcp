startCommand:
  type: http
  configSchema:
    type: object
    properties:
      counselApiKey:
        type: string
        description: Your Counsel API Key (Optional if using OAuth)
  commandFunction: |-
    (config) => ({
      command: ["node", "dist/index.js", "http", "--port", "8080", "--host", "0.0.0.0"],
      env: {
        COUNSEL_API_KEY: config.counselApiKey || ""
      }
    })
build:
  dockerfile: Dockerfile
  context: .
runtime: container
